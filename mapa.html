        /* herramientas de dibujo */
        function chip(t) {
          var e = $('#chip');
          e.textContent = t || '';
          e.style.display = t ? 'block' : 'none'
        }

        function setTool(t) {
          tool = t;
          draft = null;
          dG.clearLayers();
          if (t !== 'select') {
            sel = null;
            selV = -1;
            showHandles();
            sheet()
          }
          document.body.classList.toggle('drawing', t !== 'select');
          $$('.tools [data-t]').forEach(function(b) {
            b.classList.toggle('on', b.getAttribute('data-t') === t)
          });
          dact();
          chip('');
          var H = {
            shp: 'Toque dos esquinas opuestas.',
            poly: 'Toque los vértices del lote. Termine tocando el primero o con ✔.',
            line: 'Toque los puntos de la línea y pulse ✔ Terminar.',
            arrow: 'Toque el inicio y luego la punta de la flecha.',
            circle: 'Toque el centro y luego el borde del círculo.',
            point: 'Toque donde va el punto.',
            text: 'Toque donde va el texto.'
          };
          if (H[t]) toast(H[t], 3200)
        }

        $('#tlt').onclick = function() {
          var t = $('.tools');
          t.classList.toggle('open');
          this.classList.toggle('on', t.classList.contains('open'));
        };

        $$('.tools [data-t]').forEach(function(b) {
          b.onclick = function() {
            if (aligning) {
              toast('Termine primero la alineación (Listo).');
              return
            }
            setTool(b.getAttribute('data-t'))
          }
        });

        function dact() {
          $('#dact').style.display = draft && draft.pts.length && !aligning ? 'flex' : 'none';
          $('#dfin').style.display = (tool === 'poly' || tool === 'line') ? '' : 'none'
        }

        function drawDraft(extra) {
          dG.clearLayers();
          if (!draft) return;
          var P = draft.pts.slice(),
            c = DEFAULT_COLOR;
          if (extra && P.length) P.push(extra);
          if (tool === 'poly' && P.length > 2) dG.addLayer(L.polygon(P, {
            color: c,
            weight: S.lw,
            dashArray: '5 5',
            fillColor: c,
            fillOpacity: .15,
            interactive: false
          }));
          else if (P.length > 1 && tool !== 'circle' && tool !== 'shp') dG.addLayer(L.polyline(P, {
            color: c,
            weight: S.lw,
            dashArray: '5 5',
            interactive: false
          }));
          if (tool === 'circle' && P.length > 1) {
            dG.addLayer(L.circle(P[0], {
              radius: distM(P[0], P[1]),
              color: c,
              weight: S.lw,
              dashArray: '5 5',
              fillOpacity: .1,
              interactive: false
            }))
          }
          if (tool === 'shp' && P.length > 1) dG.addLayer(L.rectangle(L.latLngBounds(P[0], P[1]), {
            color: c,
            weight: S.lw,
            dashArray: '5 5',
            fillOpacity: .12,
            interactive: false
          }));
          draft.pts.forEach(function(p, i) {
            dG.addLayer(L.circleMarker(p, {
              radius: i === 0 && tool === 'poly' ? 6 : 4,
              color: '#fff',
              weight: 1.5,
              fillColor: i === 0 ? '#4CD97B' : c,
              fillOpacity: 1,
              interactive: false
            }))
          });
          var t = '';
          if (tool === 'poly' && P.length > 2) t = fArea(areaM2(P)) + '\nPerímetro ' + fLen(lenM(P, true));
          else if ((tool === 'line' || tool === 'arrow') && P.length > 1) t = 'Distancia ' + fLen(lenM(P));
          else if (tool === 'circle' && P.length > 1) t = 'Radio ' + fLen(distM(P[0], P[1]));
          chip(t)
        }

        function finishDraft() {
          if (!draft) return;
          var P = draft.pts,
            ok = (tool === 'poly' && P.length >= 3) || (tool === 'line' && P.length >= 2) || (tool === 'arrow' && P.length === 2) || (tool === 'circle' && P.length === 2) || (tool === 'shp' && P.length === 2);
          if (!ok) {
            toast(tool === 'poly' ? 'Un área necesita al menos 3 puntos.' : 'Faltan puntos.');
            return
          }
          pushUndo();
          var it = {
            id: seq++,
            type: tool,
            pts: P.map(function(p) {
              return p.slice()
            })
          };
          if (tool === 'circle') {
            it.r = Math.max(1, distM(P[0], P[1]))
          }
          if (tool === 'shp') {
            var ma = SM.project(L.latLng(P[0][0], P[0][1])),
              mb = SM.project(L.latLng(P[1][0], P[1][1])),
              cl = SM.unproject(L.point((ma.x + mb.x) / 2, (ma.y + mb.y) / 2)),
              kk = Math.cos(R(cl.lat));
            it = {
              id: it.id,
              type: 'shp',
              key: variant.key || 'rect',
              pts: [
                [cl.lat, cl.lng]
              ],
              w: Math.max(2, Math.abs(ma.x - mb.x) / 2 * kk),
              h: Math.max(2, Math.abs(ma.y - mb.y) / 2 * kk),
              rot: 0
            }
          }
          items.push(it);
          draft = null;
          dG.clearLayers();
          renderItem(it);
          save();
          dact();
          setTool('select');
          selectItem(it.id);
          toast('Listo: mide ' + measureText(it).split('\n')[0] + '.', 4000);
          setTimeout(function() {
            $('#sTxt').focus()
          }, 80)
        }

        map.on('click', function(e) {
          if (aligning) return;
          var ll = [e.latlng.lat, e.latlng.lng];
          if (tool === 'select') {
            if (sel) {
              sel = null;
              selV = -1;
              showHandles();
              sheet()
            }
            return
          }
          if (tool === 'point' || tool === 'text') {
            pushUndo();
            var it = {
              id: seq++,
              type: tool,
              pts: [ll],
              txt: tool === 'text' ? 'Texto' : ''
            };
            items.push(it);
            renderItem(it);
            save();
            setTool('select');
            selectItem(it.id);
            setTimeout(function() {
              var t = $('#sTxt');
              t.focus();
              t.select()
            }, 60);
            return
          }
          draft = draft || {
            pts: []
          };
          if (tool === 'poly' && draft.pts.length >= 3) {
            var a = map.latLngToContainerPoint(draft.pts[0]),
              b = map.latLngToContainerPoint(e.latlng);
            if (a.distanceTo(b) < 18) {
              finishDraft();
              return
            }
          }
          draft.pts.push(ll);
          drawDraft();
          dact();
          if ((tool === 'arrow' || tool === 'circle' || tool === 'shp') && draft.pts.length === 2) finishDraft()
        });

        map.on('mousemove', function(e) {
          if (draft && draft.pts.length && (tool === 'poly' || tool === 'line' || tool === 'arrow' || tool === 'circle' || tool === 'shp')) drawDraft([e.latlng.lat, e.latlng.lng])
        });

        $('#dpt').onclick = function() {
          if (draft) {
            draft.pts.pop();
            if (!draft.pts.length) draft = null;
            drawDraft();
            dact()
          }
        };
        $('#dfin').onclick = finishDraft;
        $('#dcan').onclick = function() {
          draft = null;
          dG.clearLayers();
          chip('');
          dact()
        };

        /* GPS y grabación de ruta */
        var gwid = null,
          gDot = null,
          gAcc = null,
          gLast = null,
          follow = false,
          rec = null;

        function recHtml() {
          return rec ? '<button id="recStop" class="dng">⏹ Guardar ruta (' + rec.pts.length + ')</button>' : '<button id="recGo">⏺ Grabar ruta</button>';
        }

        function recBind() {
          var go = $('#recGo'),
            st = $('#recStop');
          if (go) go.onclick = function() {
            rec = {
              pts: gLast ? [gLast.ll.slice()] : [],
              ly: L.polyline([], {
                color: '#4CD97B',
                weight: 4
              }).addTo(gG)
            };
            toast('Grabando ruta GPS...');
          };
          if (st) st.onclick = function() {
            if (rec && rec.pts.length > 1) {
              pushUndo();
              var it = {
                id: seq++,
                type: 'line',
                pts: rec.pts,
                txt: 'Ruta GPS ' + stamp()
              };
              items.push(it);
              renderItem(it);
              save();
              selectItem(it.id);
              toast('Ruta guardada.');
            }
            if (rec && rec.ly) gG.removeLayer(rec.ly);
            rec = null;
          };
        }

        function recFeed(ll) {
          if (!rec) return;
          if (!rec.pts.length || distM(rec.pts[rec.pts.length - 1], ll) >= 3) {
            rec.pts.push(ll.slice());
            rec.ly.setLatLngs(rec.pts);
          }
        }

        function gpsOff() {
          if (rec) {
            if (rec.ly) gG.removeLayer(rec.ly);
            rec = null
          }
          if (gwid != null) navigator.geolocation.clearWatch(gwid);
          gwid = null;
          gG.clearLayers();
          gDot = gAcc = gLast = null;
          follow = false;
          $('#gps').classList.remove('on');
          $('#gpsb').style.display = 'none';
          $('#gchip').style.display = 'none'
        }

        $('#gps').onclick = function() {
          if (gwid != null) {
            gpsOff();
            return
          }
          if (!navigator.geolocation) {
            toast('Este dispositivo no ofrece GPS.');
            return
          }
          var first = true;
          $('#gps').classList.add('on');
          $('#gpsb').style.display = 'block';
          toast('Buscando su ubicación…');
          gwid = navigator.geolocation.watchPosition(function(p) {
            var ll = [p.coords.latitude, p.coords.longitude],
              acc = p.coords.accuracy || 0;
            gLast = {
              ll: ll,
              acc: acc
            };
            recFeed(ll);
            if (!gDot) {
              gAcc = L.circle(ll, {
                radius: acc,
                color: '#4CD97B',
                weight: 1,
                fillColor: '#4CD97B',
                fillOpacity: .16,
                interactive: false
              }).addTo(gG);
              gDot = L.circleMarker(ll, {
                radius: 8,
                color: '#fff',
                weight: 2.5,
                fillColor: '#4CD97B',
                fillOpacity: 1,
                interactive: false
              }).addTo(gG)
            } else {
              gDot.setLatLng(ll);
              gAcc.setLatLng(ll);
              gAcc.setRadius(acc)
            }
            if (first) {
              first = false;
              follow = true;
              map.setView(ll, Math.max(map.getZoom(), 17))
            } else if (follow) map.panTo(ll);

            var g = $('#gchip');
            g.style.display = 'block';
            g.innerHTML = esc(ll[0].toFixed(6) + ', ' + ll[1].toFixed(6) + '  (±' + Math.round(acc) + ' m)') + '<br><button id="gadd">＋ Punto aquí</button> ' + recHtml();
            recBind();
            $('#gadd').onclick = function() {
              if (!gLast) return;
              pushUndo();
              var it = {
                id: seq++,
                type: 'point',
                pts: [gLast.ll.slice()],
                txt: ''
              };
              items.push(it);
              renderItem(it);
              save();
              selectItem(it.id)
            }
          }, function(e) {
            toast('No se pudo leer el GPS. Verifique permisos de ubicación.', 6000);
            gpsOff()
          }, {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 25000
          })
        };

        $('#gpsb').onclick = function() {
          if (gLast) {
            follow = true;
            map.setView(gLast.ll, Math.max(map.getZoom(), 17))
          }
        };
        map.on('dragstart', function() {
          follow = false
        });

        /* Buscador de dibujos */
        $('#srch').onclick = function() {
          $('#sp').style.display = 'block';
          $('#sq').value = '';
          renderSearch('');
          $('#sq').focus();
        };
        $('#sx').onclick = function() {
          $('#sp').style.display = 'none'
        };
        $('#sq').oninput = function(e) {
          renderSearch(e.target.value)
        };

        function renderSearch(q) {
          var l = $('#sl');
          l.innerHTML = '';
          q = q.trim().toLowerCase();
          var res = items.filter(function(it) {
            return !q || (it.txt && it.txt.toLowerCase().indexOf(q) >= 0) || (it.desc && it.desc.toLowerCase().indexOf(q) >= 0);
          });
          if (!res.length) {
            l.innerHTML = '<div style="padding:8px;color:var(--mut)">Sin resultados.</div>';
            return;
          }
          res.forEach(function(it) {
            var b = document.createElement('button');
            b.className = 'it';
            b.innerHTML = '<div><b>' + esc(it.txt || TN[it.type]) + '</b><small>' + esc(measureText(it).replace(/\n/g, ' · ')) + '</small></div>';
            b.onclick = function() {
              $('#sp').style.display = 'none';
              var ll = (it.type === 'point' || it.type === 'text' || it.type === 'circle' || it.type === 'shp') ? it.pts[0] : centroid(it.pts);
              map.setView(ll, 17);
              selectItem(it.id);
            };
            l.appendChild(b);
          });
        }

        /* Regiones guardadas */
        var regions = [];
        async function regLoad() {
          regions = (await idbGet('regions')) || [];
          renderRegs();
        }
        async function regAdd(buf, name) {
          if (!pdfAuto) return;
          var G = mkGeo(pdfAuto.A, pdfAuto.B);
          var b = L.latLngBounds([pxLL(G, 0, 0), pxLL(G, plan.W, plan.H)]);
          var id = 'reg_' + Date.now();
          await idbSet(id, buf);
          regions.push({
            id: id,
            name: name.replace(/\.pdf$/i, ''),
            bounds: [
              [b.getSouth(), b.getWest()],
              [b.getNorth(), b.getEast()]
            ],
            geo: pdfAuto
          });
          await idbSet('regions', regions);
          renderRegs();
        }

        function renderRegs() {
          var box = $('#regs'),
            pop = $('#regp');
          box.innerHTML = '';
          pop.innerHTML = '<div class="rh"><b>Regiones guardadas</b><button id="regx">✕</button></div>';
          $('#regx').onclick = function() {
            pop.style.display = 'none'
          };
          if (!regions.length) {
            box.innerHTML = '<small>Abra un PDF georreferenciado para guardarlo como región.</small>';
            pop.innerHTML += '<small>Aún no hay regiones guardadas.</small>';
            return;
          }
          regions.forEach(function(r, idx) {
            var row = document.createElement('div');
            row.className = 'row';
            var b = document.createElement('button');
            b.style.flex = '1';
            b.textContent = r.name;
            b.onclick = async function() {
              var buf = await idbGet(r.id);
              if (buf) openPdfBuffer(buf, r.name, r.geo, true);
              openM(false);
            };
            var del = document.createElement('button');
            del.className = 'dng';
            del.textContent = '✕';
            del.onclick = async function() {
              await idbSet(r.id, null);
              regions.splice(idx, 1);
              await idbSet('regions', regions);
              renderRegs();
            };
            row.appendChild(b);
            row.appendChild(del);
            box.appendChild(row);

            var rb = document.createElement('button');
            rb.className = 'rg';
            rb.innerHTML = '<span>' + esc(r.name) + '</span><small>Toque para cargar plano</small>';
            rb.onclick = async function() {
              pop.style.display = 'none';
              var buf = await idbGet(r.id);
              if (buf) openPdfBuffer(buf, r.name, r.geo, true);
            };
            pop.appendChild(rb);
          });
        }
        $('#regb').onclick = function() {
          var p = $('#regp');
          p.style.display = p.style.display === 'block' ? 'none' : 'block';
        };
        $('#regGps').onclick = function() {
          if (!gLast) {
            toast('Active primero el botón 📍 GPS.');
            return
          }
          var pt = L.latLng(gLast.ll);
          var found = regions.find(function(r) {
            return L.latLngBounds(r.bounds).contains(pt)
          });
          if (found) {
            idbGet(found.id).then(function(buf) {
              if (buf) openPdfBuffer(buf, found.name, found.geo, true);
              openM(false);
            });
          } else {
            toast('Su ubicación actual no coincide con ninguna región guardada.');
          }
        };

        /* menú, ir a coordenadas, apariencia */
        function openM(v) {
          document.body.classList.toggle('open', v)
        }
        $('#menu').onclick = function() {
          openM(true)
        };
        $('#x').onclick = $('#bk').onclick = function() {
          openM(false)
        };
        $$('[data-b]').forEach(function(b) {
          b.onclick = function() {
            setBase(b.getAttribute('data-b'))
          }
        });
        $('#gob').onclick = function() {
          var m = $('#goc').value.match(/-?\d+(?:[.,]\d+)?/g);
          if (!m || m.length < 2) {
            toast('Escriba latitud y longitud, ej. 14.33, -91.05');
            return
          }
          var la = parseFloat(m[0].replace(',', '.')),
            lo = parseFloat(m[1].replace(',', '.'));
          if (!(Math.abs(la) <= 90 && Math.abs(lo) <= 180)) {
            toast('Coordenadas no válidas.');
            return
          }
          map.setView([la, lo], 17);
          openM(false)
        };
        $('#lw').oninput = function(e) {
          S.lw = +e.target.value;
          renderAll();
          showHandles();
          save()
        };
        $('#fs').oninput = function(e) {
          S.fs = +e.target.value;
          renderAll();
          showHandles();
          save()
        };
        $('#sm').onchange = function(e) {
          S.sm = e.target.checked;
          renderAll();
          showHandles();
          save()
        };
        $('#clr').onclick = function() {
          if (!items.length) {
            toast('No hay dibujos.');
            return
          }
          if (confirm('¿Borrar TODOS los dibujos? Podrá usar Deshacer.')) {
            pushUndo();
            items = [];
            sel = null;
            renderAll();
            showHandles();
            sheet();
            save();
            openM(false)
          }
        };

        /* exportar */
        function dl(name, mime, text) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([text], {
            type: mime
          }));
          a.download = name;
          document.body.appendChild(a);
          a.click();
          setTimeout(function() {
            URL.revokeObjectURL(a.href);
            a.remove()
          }, 500)
        }

        function circPts(it) {
          var o = [];
          for (var i = 0; i <= 64; i++) {
            var a = i / 64 * 2 * Math.PI;
            o.push([it.pts[0][0] + it.r / 111320 * Math.sin(a), it.pts[0][1] + it.r / (111320 * Math.cos(R(it.pts[0][0]))) * Math.cos(a)])
          }
          return o
        }

        function toKml() {
          var s = '<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Mapa de áreas</name>';
          s += '<Style id="def"><LineStyle><color>ff7bd94c</color><width>2.5</width></LineStyle><PolyStyle><color>557bd94c</color></PolyStyle></Style>';
          var co = function(P) {
            return P.map(function(p) {
              return p[1] + ',' + p[0] + ',0'
            }).join(' ')
          };
          items.forEach(function(it) {
            var nm = it.txt || TN[it.type],
              d = measureText(it).replace(/\n/g, ' · '),
              g = '';
            if (it.type === 'poly') {
              var P = it.pts.concat([it.pts[0]]);
              g = '<Polygon><outerBoundaryIs><LinearRing><coordinates>' + co(P) + '</coordinates></LinearRing></outerBoundaryIs></Polygon>'
            } else if (it.type === 'line' || it.type === 'arrow') g = '<LineString><tessellate>1</tessellate><coordinates>' + co(pathOf(it)) + '</coordinates></LineString>';
            else if (it.type === 'shp') {
              g = '<MultiGeometry>' + shpRings(it).map(function(part) {
                return '<Polygon><outerBoundaryIs><LinearRing><coordinates>' + co(part[0].concat([part[0][0]])) + '</coordinates></LinearRing></outerBoundaryIs></Polygon>'
              }).join('') + '</MultiGeometry>'
            } else if (it.type === 'circle') g = '<Polygon><outerBoundaryIs><LinearRing><coordinates>' + co(circPts(it)) + '</coordinates></LinearRing></outerBoundaryIs></Polygon>';
            else g = '<Point><coordinates>' + co(it.pts) + '</coordinates></Point>';
            s += '<Placemark><name>' + esc(nm) + '</name><description>' + esc(d + (it.desc ? ' — ' + it.desc : '')) + '</description><styleUrl>#def</styleUrl>' + g + '</Placemark>'
          });
          return s + '</Document></kml>'
        }

        function toGeo() {
          return JSON.stringify({
            type: 'FeatureCollection',
            features: items.map(function(it) {
              var P = it.pts.map(function(p) {
                  return [p[1], p[0]]
                }),
                geom, pr = {
                  nombre: it.txt || '',
                  tipo: TN[it.type],
                  descripcion: it.desc || ''
                };
              if (it.type === 'poly') {
                geom = {
                  type: 'Polygon',
                  coordinates: [P.concat([P[0]])]
                };
                pr.area_ha = +(areaM2(it.pts) / 1e4).toFixed(4);
                pr.area_mz = +(areaM2(it.pts) / 1e4 / MZ).toFixed(4)
              } else if (it.type === 'line' || it.type === 'arrow') {
                geom = {
                  type: 'LineString',
                  coordinates: pathOf(it).map(function(p) {
                    return [p[1], p[0]]
                  })
                };
                pr.largo_m = Math.round(lenM(it.pts))
              } else if (it.type === 'shp') {
                geom = {
                  type: 'MultiPolygon',
                  coordinates: shpRings(it).map(function(part) {
                    return part.map(function(r) {
                      var q = r.map(function(p) {
                        return [p[1], p[0]]
                      });
                      return q.concat([q[0]])
                    })
                  })
                }
              } else if (it.type === 'circle') {
                var q = circPts(it).map(function(p) {
                  return [p[1], p[0]]
                });
                geom = {
                  type: 'Polygon',
                  coordinates: [q]
                };
                pr.radio_m = Math.round(it.r)
              } else geom = {
                type: 'Point',
                coordinates: P[0]
              };
              return {
                type: 'Feature',
                properties: pr,
                geometry: geom
              }
            })
          })
        }

        $('#xk').onclick = function() {
          if (!items.length) {
            toast('No hay dibujos para exportar.');
            return
          }
          dl('mapa_areas.kml', 'application/vnd.google-earth.kml+xml', toKml())
        };
        $('#xg').onclick = function() {
          if (!items.length) {
            toast('No hay dibujos para exportar.');
            return
          }
          dl('mapa_areas.geojson', 'application/geo+json', toGeo())
        };

        async function backupJson() {
          var fo = {};
          for (var i = 0; i < items.length; i++)
            if (items[i].ph) {
              try {
                var v = await fotoGet(items[i].id);
                if (v) fo[items[i].id] = v
              } catch (e) {}
            }
          return JSON.stringify({
            v: 2,
            items: items,
            seq: seq,
            S: S,
            geo: plan && plan.geo ? plan.geo : null,
            fotos: fo
          })
        }

        $('#xb').onclick = async function() {
          dl('respaldo_mapa.json', 'application/json', await backupJson())
        };
        $('#xw').onclick = async function() {
          var txt = await backupJson(),
            nm = 'Respaldo_Mapa_' + stamp() + '.txt',
            f = null;
          try {
            f = new File([txt], nm, {
              type: 'text/plain'
            })
          } catch (e) {}
          if (f && navigator.canShare && navigator.canShare({
              files: [f]
            })) {
            navigator.share({
              files: [f],
              title: 'Respaldo del mapa'
            }).catch(function(e) {
              if (e && e.name !== 'AbortError') toast('No se pudo compartir.')
            })
          } else {
            dl(nm, 'text/plain', txt);
            toast('Se descargó el respaldo para adjuntarlo en WhatsApp.', 5000)
          }
        };

        $('#ib').onchange = function(e) {
          var f = e.target.files[0];
          if (!f) return;
          var r = new FileReader();
          r.onload = async function() {
            try {
              var o = JSON.parse(r.result);
              if (!o.items) throw 0;
              pushUndo();
              items = o.items;
              seq = o.seq || items.length + 1;
              if (o.fotos) {
                for (var k in o.fotos) await fotoSet(k, o.fotos[k]);
              }
              renderAll();
              save();
              openM(false);
              toast('Respaldo cargado.');
            } catch (x) {
              toast('Ese archivo no es un respaldo válido.')
            }
          };
          r.readAsText(f);
          e.target.value = ''
        };

        /* IndexedDB */
        function idb() {
          return new Promise(function(res, rej) {
            var r = indexedDB.open('mapa_db', 1);
            r.onupgradeneeded = function() {
              r.result.createObjectStore('kv')
            };
            r.onsuccess = function() {
              res(r.result)
            };
            r.onerror = function() {
              rej(r.error)
            }
          })
        }

        function idbSet(k, v) {
          return idb().then(function(d) {
            return new Promise(function(res) {
              var t = d.transaction('kv', 'readwrite');
              t.objectStore('kv').put(v, k);
              t.oncomplete = function() {
                res(true)
              };
              t.onerror = function() {
                res(false)
              }
            })
          }).catch(function() {
            return false
          })
        }

        function idbGet(k) {
          return idb().then(function(d) {
            return new Promise(function(res) {
              var q = d.transaction('kv').objectStore('kv').get(k);
              q.onsuccess = function() {
                res(q.result)
              };
              q.onerror = function() {
                res(null)
              }
            })
          }).catch(function() {
            return null
          })
        }

        /* ---------- galería de formas geométricas ---------- */
        var variant = {},
          SHP = {};

        function def(k, n, f) {
          SHP[k] = {
            n: n,
            f: f
          }
        }

        function one(pts) {
          return function() {
            return [
              [pts]
            ]
          }
        }

        function pl(k, n, pts) {
          def(k, n, one(pts))
        }

        pl('rect', 'Rectángulo', [
          [0, 0],
          [1, 0],
          [1, 1],
          [0, 1]
        ]);
        pl('tri', 'Triángulo', [
          [.5, 0],
          [1, 1],
          [0, 1]
        ]);
        pl('diamond', 'Rombo', [
          [.5, 0],
          [1, .5],
          [.5, 1],
          [0, .5]
        ]);
        pl('pent', 'Pentágono', [
          [.5, 0],
          [1, .38],
          [.81, 1],
          [.19, 1],
          [0, .38]
        ]);
        pl('hex', 'Hexágono', [
          [.22, 0],
          [.78, 0],
          [1, .5],
          [.78, 1],
          [.22, 1],
          [0, .5]
        ]);
        pl('plus', 'Cruz', [
          [.35, 0],
          [.65, 0],
          [.65, .35],
          [1, .35],
          [1, .65],
          [.65, .65],
          [.65, 1],
          [.35, 1],
          [.35, .65],
          [0, .65],
          [0, .35],
          [.35, .35]
        ]);
        pl('rarr', 'Flecha bloque', [
          [0, .28],
          [.58, .28],
          [.58, 0],
          [1, .5],
          [.58, 1],
          [.58, .72],
          [0, .72]
        ]);

        function shpFrame(it) {
          var c = SM.project(L.latLng(it.pts[0][0], it.pts[0][1])),
            k = 1 / Math.cos(R(it.pts[0][0])),
            a = it.rot || 0;
          return {
            c: c,
            k: k,
            co: Math.cos(a),
            si: Math.sin(a)
          }
        }

        function shpPt(it, lx, ly, fr) {
          var f = fr || shpFrame(it),
            ll = SM.unproject(L.point(f.c.x + (lx * f.co - ly * f.si) * f.k, f.c.y + (lx * f.si + ly * f.co) * f.k));
          return [ll.lat, ll.lng]
        }

        function shpRings(it) {
          var defn = SHP[it.key] || SHP.rect,
            fr = shpFrame(it);
          return defn.f().map(function(part) {
            return part.map(function(ring) {
              return ring.map(function(p) {
                return shpPt(it, (p[0] - .5) * 2 * it.w, (.5 - p[1]) * 2 * it.h, fr)
              })
            })
          })
        }

        function buildGal() {
          var c = $('#galc');
          c.innerHTML = '<h4>Formas básicas</h4><div class="g" id="ggrid"></div>';
          var g = $('#ggrid');
          Object.keys(SHP).forEach(function(k) {
            var b = document.createElement('button');
            b.title = SHP[k].n;
            var pts = SHP[k].f()[0][0].map(function(p) {
              return (p[0] * 32 + 4) + ',' + (p[1] * 32 + 4)
            }).join(' ');
            b.innerHTML = '<svg width="40" height="40" viewBox="0 0 40 40"><polygon points="' + pts + '" fill="#4CD97B" fill-opacity="0.4" stroke="#4CD97B" stroke-width="2"/></svg>';
            b.onclick = function() {
              variant = {
                key: k
              };
              $('#gal').style.display = 'none';
              setTool('shp');
            };
            g.appendChild(b);
          });
        }
        $('#galb').onclick = function() {
          buildGal();
          $('#gal').style.display = 'block';
        };
        $('#galx').onclick = function() {
          $('#gal').style.display = 'none'
        };

        /* ---------- Inicialización ---------- */
        (async function init() {
          try {
            var raw = localStorage.getItem('mapa_state_v2');
            if (raw) {
              var st = JSON.parse(raw);
              items = st.items || [];
              seq = st.seq || (items.length + 1);
              if (st.S) S = L.extend(S, st.S);
              $('#lw').value = S.lw;
              $('#fs').value = S.fs;
              $('#sm').checked = S.sm;
              setBase(S.base);
              renderAll();
              if (drawG.getBounds().isValid()) map.fitBounds(drawG.getBounds().pad(0.15));

              var savedPdf = await idbGet('pdf');
              if (savedPdf && savedPdf.buf) {
                await openPdfBuffer(savedPdf.buf, savedPdf.name, st.geo || true, true);
                if (st.pop) setOp(st.pop);
              }
            } else {
              setBase('sat');
            }
          } catch (e) {
            setBase('sat');
          }
          await regLoad();
          btns();
        })();
      })();
    </script>
  </body>

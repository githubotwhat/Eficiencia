<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador y Ajuste de Mapas - Campo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        #map {
            width: 100%;
            height: calc(100vh - 65px);
        }
        .toolbar {
            height: 65px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            box-sizing: border-box;
            overflow-x: auto;
        }
        .btn {
            background-color: #2e7d32;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            border: none;
            white-space: nowrap;
        }
        .btn:hover {
            background-color: #388e3c;
        }
        .btn-secondary {
            background-color: #d32f2f;
        }
        .btn-secondary:hover {
            background-color: #e53935;
        }
        .btn-save {
            background-color: #1976D2;
        }
        .btn-save:hover {
            background-color: #2196F3;
        }
        input[type="file"] {
            display: none;
        }
        .select-region {
            background: #2a2a2a;
            color: white;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            font-size: 13px;
        }
        .controls-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .controls-panel label {
            font-size: 11px;
            color: #bbb;
        }
        .controls-panel input {
            width: 120px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <label class="btn">
            📂 Cargar KML / KMZ
            <input type="file" id="fileInput" accept=".kml,.kmz,.geojson,.json">
        </label>

        <select id="regionSelect" class="select-region">
            <option value="frenteA">Frente 03 - Turno A (Azul)</option>
            <option value="frenteB">Frente 03 - Turno B (Naranja)</option>
            <option value="zonaNorte">Zona Norte / Lotes (Verde)</option>
        </select>

        <button class="btn btn-save" id="saveBtn">💾 Guardar Mapa</button>
        <button class="btn btn-secondary" id="clearBtn">🗑️ Borrar Capas</button>
    </div>

    <!-- Panel flotante para ajustar rotación y escala del mapa cargado -->
    <div class="controls-panel">
        <strong>Ajustar Capa Activa</strong>
        <div>
            <label>Rotación (°): <span id="rotVal">0</span></label><br>
            <input type="range" id="rotateRange" min="-180" max="180" value="0">
        </div>
        <div>
            <label>Escala / Zoom: <span id="scaleVal">1.0</span></label><br>
            <input type="range" id="scaleRange" min="0.5" max="2" step="0.05" value="1">
        </div>
    </div>

    <div id="map"></div>

    <!-- Librerías Leaflet, JSZip y Omnivore -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.4/leaflet-omnivore.min.js'></script>

    <script>
        // Inicializar mapa centrado en Guatemala (Escuintla / Zona de trabajo)
        const map = L.map('map').setView([14.15, -91.15], 11);

        // Capa satelital de fondo
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        let currentLayer = null;
        let layerDataGeoJSON = null;

        // Colores según región seleccionada
        const regionColors = {
            frenteA: '#2196F3', // Azul
            frenteB: '#FF9800', // Naranja
            zonaNorte: '#4CAF50' // Verde
        };

        // Cargar mapa guardado previamente en el dispositivo si existe
        window.addEventListener('DOMContentLoaded', () => {
            const savedGeoJSON = localStorage.getItem('saved_map_layer');
            if (savedGeoJSON) {
                try {
                    const data = JSON.parse(savedGeoJSON);
                    renderGeoJSON(data);
                } catch(e) {
                    console.error("Error al cargar mapa guardado", e);
                }
            }
        });

        // Manejo de carga de archivos KML / KMZ / GeoJSON
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            const selectedRegion = document.getElementById('regionSelect').value;
            const color = regionColors[selectedRegion] || '#2196F3';

            try {
                if (fileName.endsWith('.kmz')) {
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(file);
                    let kmlText = null;
                    for (let filename of Object.keys(zipContent.files)) {
                        if (filename.toLowerCase().endsWith('.kml')) {
                            kmlText = await zipContent.files[filename].async("text");
                            break;
                        }
                    }
                    if (kmlText) {
                        parseKML(kmlText, color);
                    } else {
                        alert("No se encontró KML dentro del KMZ.");
                    }
                } else if (fileName.endsWith('.kml')) {
                    const reader = new FileReader();
                    reader.onload = (event) => parseKML(event.target.result, color);
                    reader.readAsText(file);
                } else if (fileName.endsWith('.geojson') || fileName.endsWith('.json')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const data = JSON.parse(event.target.result);
                        layerDataGeoJSON = data;
                        renderGeoJSON(data, color);
                    };
                    reader.readAsText(file);
                }
            } catch (err) {
                console.error(err);
                alert("Error al leer el archivo geográfico.");
            }
        });

        function parseKML(kmlText, color) {
            if (currentLayer) map.removeLayer(currentLayer);
            currentLayer = omnivore.kml.parse(kmlText);
            currentLayer.setStyle({ color: color, fillColor: color, fillOpacity: 0.4, weight: 2 });
            currentLayer.addTo(map);
            currentLayer.on('ready', function() {
                map.fitBounds(currentLayer.getBounds());
                // Convertir a GeoJSON interno para persistencia
                layerDataGeoJSON = currentLayer.toGeoJSON();
            });
        }

        function renderGeoJSON(data, color = '#2196F3') {
            if (currentLayer) map.removeLayer(currentLayer);
            layerDataGeoJSON = data;
            currentLayer = L.geoJSON(data, {
                style: function() {
                    return { color: color, weight: 2, fillOpacity: 0.4 };
                }
            }).addTo(map);
            try {
                map.fitBounds(currentLayer.getBounds());
            } catch(e){}
        }

        // Guardar permanentemente en el navegador (localStorage)
        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!layerDataGeoJSON) {
                alert("No hay ninguna capa activa para guardar.");
                return;
            }
            localStorage.setItem('saved_map_layer', JSON.stringify(layerDataGeoJSON));
            alert("¡Mapa y regiones guardados correctamente en el dispositivo!");
        });

        // Borrar capas
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
                layerDataGeoJSON = null;
                localStorage.removeItem('saved_map_layer');
                alert("Capas borradas y almacenamiento limpiado.");
            }
        });

        // Controles deslizantes de Rotación y Escala visual
        const rotateRange = document.getElementById('rotateRange');
        const scaleRange = document.getElementById('scaleRange');

        rotateRange.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('rotVal').innerText = val;
            if (currentLayer && currentLayer.getPane()) {
                currentLayer.getPane().style.transform = `rotate(${val}deg)`;
            }
        });

        scaleRange.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('scaleVal').innerText = val;
            if (currentLayer && currentLayer.getPane()) {
                currentLayer.getPane().style.transform = `scale(${val})`;
            }
        });
    </script>
</body>
</html>

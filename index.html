<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logística APK Pro - Escáner y Control</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2, h3 {
      text-align: center;
      color: var(--primary-color);
    }
    .section {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    input[type="text"], button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #1b5e20;
    }
    .scan-log {
      max-height: 200px;
      overflow-y: auto;
      background: #eee;
      padding: 10px;
      border-radius: 4px;
    }
    .log-item {
      padding: 6px 0;
      border-bottom: 1px solid #ddd;
    }
    .status-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #e0e0e0;
      float: right;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Logística APK Pro</h2>

  <!-- MÓDULO DE ESCÁNER -->
  <div class="section">
    <h3>Escáner de IDs</h3>
    <input type="text" id="scanInput" placeholder="Escanee o ingrese ID (Ej: 07-225)" autofocus autocomplete="off">
    <div style="font-size: 12px; color: #666; margin-top: -5px;">* Evita duplicados en lecturas continuas y emite vibración.</div>
  </div>

  <!-- REGISTRO DE LECTURAS -->
  <div class="section">
    <h3>Registro de Escaneos (<span id="totalCount">0</span>)</h3>
    <div class="scan-log" id="scanLog"></div>
  </div>

  <!-- PANEL DE ADMINISTRACIÓN / CONFIGURACIÓN DE IDS -->
  <div class="section">
    <h3>Panel de Administración (Gestión de IDs)</h3>
    <input type="text" id="newIdInput" placeholder="Nueva ID (Ej: 11-46)">
    <button onclick="agregarIdAdmin()">Agregar / Modificar ID</button>
    
    <h4>Catálogo de IDs Activas:</h4>
    <div id="adminIdList" style="font-size: 14px; line-height: 1.6;"></div>
  </div>
</div>

<script>
  // 1. BASE DE DATOS LOCAL/ADMINISTRATIVA DE IDS
  // Si existen IDs guardadas en la administración se cargan; si no, se inicia con la lista predeterminada.
  const defaultIDs = ["07-225", "07-226", "07-227", "07-228", "11-41", "11-45"];
  let adminIDs = JSON.parse(localStorage.getItem("adminIDs_catalog")) || defaultIDs;

  // Variables para control de escaneo y anti-duplicados
  let lastScannedCode = "";
  let scanCooldownTimer = null;
  const processedScans = [];

  const scanInput = document.getElementById("scanInput");
  const scanLog = document.getElementById("scanLog");
  const totalCount = document.getElementById("totalCount");
  const adminIdList = document.getElementById("adminIdList");

  // Renderiza el catálogo de IDs desde el Panel Administrativo
  function renderAdminIDs() {
    adminIdList.innerHTML = adminIDs.map(id => 
      `<span style="display:inline-block; background:#e8f5e9; padding:4px 8px; margin:2px; border-radius:4px; border:1px solid #c8e6c9;">
        ${id} <b style="color:red; cursor:pointer; margin-left:5px;" onclick="eliminarIdAdmin('${id}')">&times;</b>
      </span>`
    ).join(' ');
  }

  // Agrega nuevas IDs dinámicamente desde el Panel de Administración
  function agregarIdAdmin() {
    const input = document.getElementById("newIdInput");
    const newId = input.value.trim();
    if (newId && !adminIDs.includes(newId)) {
      adminIDs.push(newId);
      localStorage.setItem("adminIDs_catalog", JSON.stringify(adminIDs));
      renderAdminIDs();
      input.value = "";
      alert(`ID ${newId} agregada correctamente al Panel.`);
    }
  }

  // Eliminar ID del Panel
  function eliminarIdAdmin(id) {
    adminIDs = adminIDs.filter(item => item !== id);
    localStorage.setItem("adminIDs_catalog", JSON.stringify(adminIDs));
    renderAdminIDs();
  }

  // 2. FUNCIÓN DE VIBRACIÓN AL ESCANEAR
  function triggerVibration() {
    if ("vibrate" in navigator) {
      navigator.vibrate(200); // Vibra durante 200 ms
    }
  }

  // 3. PROCESAMIENTO Y CONTROL DE LECTURA (ANTI-DUPLICADOS)
  function processScan(code) {
    const cleanCode = code.trim();
    if (!cleanCode) return;

    // Control anti-duplicado inmediato
    if (cleanCode === lastScannedCode) {
      scanInput.value = "";
      return;
    }

    // Validar si la ID existe en la lista del Panel de Administración
    const isValid = adminIDs.includes(cleanCode);

    // Registro
    lastScannedCode = cleanCode;
    processedScans.unshift({ code: cleanCode, time: new Date().toLocaleTimeString(), status: isValid ? "Válido" : "No registrado" });
    
    // Activar vibración si la lectura fue procesada
    triggerVibration();

    // Actualizar Interfaz
    renderLog();

    // Reiniciar temporalmente el código previo tras 2 segundos de inactividad
    clearTimeout(scanCooldownTimer);
    scanCooldownTimer = setTimeout(() => {
      lastScannedCode = "";
    }, 2000);

    scanInput.value = "";
  }

  function renderLog() {
    scanLog.innerHTML = processedScans.map(item => 
      `<div class="log-item">
        <strong>${item.code}</strong> - ${item.time}
        <span class="status-badge" style="background:${item.status === 'Válido' ? '#c8e6c9' : '#ffcdd2'}">${item.status}</span>
      </div>`
    ).join('');
    totalCount.textContent = processedScans.length;
  }

  // Escuchar entrada de datos (Lectores de código de barras / teclados USB/BT)
  scanInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      processScan(this.value);
    }
  });

  // Inicialización
  renderAdminIDs();
</script>

</body>
</html>

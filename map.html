<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Mapas - Campo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }
        .toolbar {
            height: 60px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            box-sizing: border-box;
            overflow-x: auto;
        }
        .file-upload-btn {
            background-color: #2e7d32;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border: none;
            white-space: nowrap;
        }
        .file-upload-btn:hover {
            background-color: #388e3c;
        }
        input[type="file"] {
            display: none;
        }
        .legend {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 13px;
            white-space: nowrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <label class="file-upload-btn">
            📂 Cargar KML / KMZ
            <input type="file" id="fileInput" accept=".kml,.kmz,.geojson,.json">
        </label>
        
        <div class="legend">
            <div class="legend-item"><span class="color-box" style="background: #2196F3;"></span> Lotes A</div>
            <div class="legend-item"><span class="color-box" style="background: #FF9800;"></span> Lotes B</div>
            <div class="legend-item"><span class="color-box" style="background: #E91E63;"></span> Puntos / Rutas</div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Librerías Leaflet, JSZip (para KMZ) y Omnivore (para KML) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.4/leaflet-omnivore.min.js'></script>

    <script>
        // Inicializar mapa centrado en la región de trabajo (Guatemala)
        const map = L.map('map').setView([14.15, -91.15], 11);

        // Capa base satelital
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        let currentLayer = null;

        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Limpiar capa anterior si existe
            if (currentLayer) {
                map.removeLayer(currentLayer);
            }

            const fileName = file.name.toLowerCase();

            try {
                if (fileName.endsWith('.kmz')) {
                    // Procesar archivo KMZ (es un ZIP)
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(file);
                    
                    // Buscar el archivo .kml dentro del ZIP
                    let kmlFileText = null;
                    for (let filename of Object.keys(zipContent.files)) {
                        if (filename.toLowerCase().endsWith('.kml')) {
                            kmlFileText = await zipContent.files[filename].async("text");
                            break;
                        }
                    }

                    if (kmlFileText) {
                        currentLayer = omnivore.kml.parse(kmlFileText);
                        currentLayer.setStyle({
                            color: '#FF9800',
                            fillColor: '#FF9800',
                            fillOpacity: 0.4,
                            weight: 2
                        });
                        currentLayer.addTo(map);
                        
                        // Centrar mapa en el contenido cargado
                        currentLayer.on('ready', function() {
                            map.fitBounds(currentLayer.getBounds());
                        });
                    } else {
                        alert("No se encontró ningún archivo KML válido dentro del KMZ.");
                    }

                } else if (fileName.endsWith('.kml')) {
                    // Procesar KML directo
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        currentLayer = omnivore.kml.parse(event.target.result);
                        currentLayer.setStyle({
                            color: '#2196F3',
                            fillColor: '#2196F3',
                            fillOpacity: 0.4,
                            weight: 2
                        });
                        currentLayer.addTo(map);
                        currentLayer.on('ready', function() {
                            map.fitBounds(currentLayer.getBounds());
                        });
                    };
                    reader.readAsText(file);

                } else if (fileName.endsWith('.geojson') || fileName.endsWith('.json')) {
                    // Procesar GeoJSON
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const data = JSON.parse(event.target.result);
                        currentLayer = L.geoJSON(data, {
                            style: function(feature) {
                                return {
                                    color: feature.properties.color || '#E91E63',
                                    weight: 2,
                                    fillOpacity: 0.4
                                };
                            }
                        }).addTo(map);
                        map.fitBounds(currentLayer.getBounds());
                    };
                    reader.readAsText(file);
                }
            } catch (error) {
                console.error("Error al cargar el archivo:", error);
                alert("Hubo un error al procesar el archivo. Asegúrate de que sea un KML o KMZ válido.");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Mapas - Campo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }
        .toolbar {
            height: 60px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .file-upload-btn {
            background-color: #2e7d32;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border: none;
        }
        .file-upload-btn:hover {
            background-color: #388e3c;
        }
        input[type="file"] {
            display: none;
        }
        .legend {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <label class="file-upload-btn">
            📂 Cargar Mapa (KML/GeoJSON)
            <input type="file" id="fileInput" accept=".kml,.geojson,.json">
        </label>
        
        <div class="legend">
            <div class="legend-item"><span class="color-box" style="background: #2196F3;"></span> Frente A</div>
            <div class="legend-item"><span class="color-box" style="background: #FF9800;"></span> Frente B</div>
            <div class="legend-item"><span class="color-box" style="background: #E91E63;"></span> Zonas / Lotes</div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet & Omnivore (para carga de KML) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.4/leaflet-omnivore.min.js'></script>

    <script>
        // Inicializar mapa centrado en la región de trabajo (Escuintla/Guatemala)
        const map = L.map('map').setView([14.15, -91.15], 11);

        // Capa base satelital (ej. Esri World Imagery para campo)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Lógica para cargar archivos KML o GeoJSON con colores dinámicos
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            reader.onload = function(event) {
                const content = event.target.result;
                
                if (fileName.endsWith('.kml')) {
                    // Cargar KML usando omnivore
                    omnivore.kml.parse(content).setStyle({
                        color: '#FF9800',
                        fillColor: '#FF9800',
                        fillOpacity: 0.4,
                        weight: 2
                    }).addTo(map);
                } else if (fileName.endsWith('.geojson') || fileName.endsWith('.json')) {
                    const geojsonLayer = L.geoJSON(JSON.parse(content), {
                        style: function(feature) {
                            // Asignar colores según propiedades o por defecto
                            return {
                                color: feature.properties.color || '#2196F3',
                                weight: 2,
                                fillOpacity: 0.4
                            };
                        }
                    }).addTo(map);
                    map.fitBounds(geojsonLayer.getBounds());
                }
            };

            if (fileName.endsWith('.kml')) {
                reader.readAsText(file);
            } else {
                reader.readAsText(file);
            }
        });
    </script>
</body>
</html>
